<svg xmlns="http://www.w3.org/2000/svg" width="360" height="630" viewBox="0 0 360 630" role="img" aria-labelledby="title desc">
  <title id="title">Cópias ou partes?</title>
  <desc id="desc">Para consultar todas as unidades, uma cópia completa no nó 1 da replicação contém as seis reservas: unidade A, 101 a 103, e unidade B, 104 a 106. O nó 2 também contém as seis. No particionamento, o nó 1 contém apenas a unidade A e o nó 2 contém apenas a unidade B; a consulta precisa dos dois nós. O esquema não representa desempenho, atualização ou disponibilidade.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#17231e;font-size:16px}.title{font-size:24px;font-weight:700}.heading{font-size:18px;font-weight:700}.node{font-weight:700}.muted{fill:#53645b;font-size:14px}.selected{fill:#157451;font-size:14px;font-weight:700}</style>
  <rect width="360" height="630" fill="white"/>
  <text class="title" x="20" y="38">Cópias ou partes?</text>
  <text x="20" y="70">Consulta: todas as unidades</text>
  <text class="heading" x="20" y="116">Replicação</text>
  <rect x="20" y="132" width="150" height="182" fill="#edf5f0"/>
  <path d="M20 132H170M20 314H170" stroke="#157451" stroke-width="2"/>
  <path d="M190 132H340M190 314H340" stroke="#d9e2dc" stroke-width="2"/>
  <g transform="translate(30 159)">
    <text class="node">Nó 1</text><text class="selected" y="23">Consultado</text>
    <text class="muted" y="56">Unidade A</text><text y="78">101  102  103</text>
    <text class="muted" y="114">Unidade B</text><text y="136">104  105  106</text>
  </g>
  <g transform="translate(200 159)">
    <text class="node">Nó 2</text><text class="muted" y="23">Não necessário</text>
    <text class="muted" y="56">Unidade A</text><text y="78">101  102  103</text>
    <text class="muted" y="114">Unidade B</text><text y="136">104  105  106</text>
  </g>
  <text x="20" y="342">Uma cópia contém o conjunto inteiro.</text>
  <text class="heading" x="20" y="397">Particionamento por unidade</text>
  <rect x="20" y="413" width="150" height="123" fill="#edf5f0"/>
  <rect x="190" y="413" width="150" height="123" fill="#edf5f0"/>
  <path d="M20 413H170M20 536H170M190 413H340M190 536H340" stroke="#157451" stroke-width="2"/>
  <g transform="translate(30 440)">
    <text class="node">Nó 1</text><text class="selected" y="23">Consultado</text>
    <text class="muted" y="57">Unidade A</text><text y="80">101  102  103</text>
  </g>
  <g transform="translate(200 440)">
    <text class="node">Nó 2</text><text class="selected" y="23">Consultado</text>
    <text class="muted" y="57">Unidade B</text><text y="80">104  105  106</text>
  </g>
  <text x="20" y="565">É preciso reunir as duas partes.</text>
  <text class="muted" x="20" y="602">Esquema de destinos, sem representar</text>
  <text class="muted" x="20" y="622">velocidade, atualização ou disponibilidade.</text>
</svg>
