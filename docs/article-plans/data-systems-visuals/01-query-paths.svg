<svg xmlns="http://www.w3.org/2000/svg" width="360" height="869" viewBox="0 0 360 869" role="img" aria-labelledby="title desc">
<title id="title">Quais dados cada pergunta precisa?</title>
<desc id="desc">O mesmo histórico aparece em duas consultas. A reserva 104 destaca uma linha. A comparação das confirmadas de março usa tipo, mês e situação de várias reservas: três furadeiras e duas serras. A reserva 103, cancelada, não entra na contagem. Os destaques não representam varreduras físicas ou desempenho.</desc>
