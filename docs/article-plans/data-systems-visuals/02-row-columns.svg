<svg xmlns="http://www.w3.org/2000/svg" width="360" height="827" viewBox="0 0 360 827" role="img" aria-labelledby="title desc">
<title id="title">Quais valores ficam juntos?</title>
<desc id="desc">As mesmas seis reservas de março são agrupadas por linhas e por colunas. Por linhas, cada contorno contém ID, tipo, mês e situação da mesma reserva. Por colunas, cada contorno contém os seis valores de um atributo, na ordem dos IDs 101 a 106. Tipo e mês são marcados nos dois arranjos. Todos os campos são preservados. Este é um esquema de armazenamento, sem alegação de desempenho.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17231e;font-size:14px}.title{font-size:19px;font-weight:700}.heading{font-size:16px;font-weight:700}.muted{fill:#53645b}.strong{font-weight:700}.warm{fill:#986a30}</style>
<rect width="360" height="100%" fill="#fff"/>
