name: Deployment verification

on:
  deployment_status:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Railway environment to verify
        required: true
        type: choice
        options: [staging, production]
      expected_sha:
        description: Full Git commit SHA expected on both services
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: deployment-verification-${{ github.event.deployment.environment || inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verified deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'aflora / staging' ||
      github.event.deployment.environment == 'aflora / production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve the trusted deployment target
        id: target
        env:
          EVENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          EVENT_SHA: ${{ github.event.deployment.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          target_environment="${EVENT_ENVIRONMENT:-$INPUT_ENVIRONMENT}"
          expected_sha="${EVENT_SHA:-${INPUT_SHA:-$GITHUB_SHA}}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            target_environment="production"
          fi

          case "$target_environment" in
            staging|"aflora / staging")
              WEB_URL="https://grove-web-staging.up.railway.app"
              API_URL="https://grove-newsletter-api-staging.up.railway.app"
              OBSERVABILITY_URL="https://grove-observability-api-staging.up.railway.app"
              EXPECTED_FORM="enabled"
              EXPECTED_OBSERVABILITY="enabled"
              EXPECTED_FEEDBACK="enabled"
              EXPECTED_AUDIENCE="restricted"
              ;;
            production|"aflora / production")
              WEB_URL="https://aflora.page"
              API_URL="https://api.aflora.page"
              OBSERVABILITY_URL="https://grove-observability-api-production-production.up.railway.app"
              EXPECTED_FORM="enabled"
              EXPECTED_OBSERVABILITY="enabled"
              EXPECTED_FEEDBACK="enabled"
              EXPECTED_AUDIENCE="public"
              ;;
            *)
              echo "Ignoring deployment environment: $target_environment"
              exit 1
              ;;
          esac
          {
            echo "WEB_URL=$WEB_URL"
            echo "API_URL=$API_URL"
            echo "OBSERVABILITY_URL=$OBSERVABILITY_URL"
            echo "EXPECTED_FORM=$EXPECTED_FORM"
            echo "EXPECTED_OBSERVABILITY=$EXPECTED_OBSERVABILITY"
            echo "EXPECTED_FEEDBACK=$EXPECTED_FEEDBACK"
            echo "EXPECTED_AUDIENCE=$EXPECTED_AUDIENCE"
          } >> "$GITHUB_ENV"

          if [ "$EVENT_NAME" = "schedule" ]; then
            web_sha=$(curl --fail --silent --show-error "$WEB_URL/version.json" | jq -er '.releaseSha')
            api_sha=$(curl --fail --silent --show-error "$API_URL/health" | jq -er '.releaseSha')
            if [ "$web_sha" != "$api_sha" ]; then
              echo "Production services report different releases: web=$web_sha api=$api_sha"
              exit 1
            fi
            expected_sha="$web_sha"
          fi

          if ! printf '%s' "$expected_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Expected a full 40-character Git SHA, received: $expected_sha"
            exit 1
          fi
          echo "EXPECTED_SHA=$expected_sha" >> "$GITHUB_ENV"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the deployed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.expected_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify both services and their release identity
        run: >-
          pnpm operations:smoke
          --web-url "$WEB_URL"
          --api-url "$API_URL"
          --observability-url "$OBSERVABILITY_URL"
          --expect-signup-form "$EXPECTED_FORM"
          --expect-observability "$EXPECTED_OBSERVABILITY"
          --expect-feedback "$EXPECTED_FEEDBACK"
          --expect-audience "$EXPECTED_AUDIENCE"
          --expect-release-sha "$EXPECTED_SHA"
          --wait-seconds 600

  alert:
    name: Open production incident
    needs: smoke
    if: ${{ always() && github.event_name == 'schedule' && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the production incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="Production platform smoke failed"
          existing=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search "\"$title\" in:title" \
            --json number \
            --jq '.[0].number // ""')
          body="The scheduled production smoke test failed: $RUN_URL

          Pause newsletter delivery while investigating. Disable public signup
          if API health, PostgreSQL, CORS, consent persistence, or the public
          audience policy is unsafe. Keep the website readable whenever possible."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$title" --body "$body"
          fi

  recover:
    name: Close resolved production incident
    needs: smoke
    if: ${{ always() && github.event_name == 'schedule' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Close any open production incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="Production platform smoke failed"
          existing=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search "\"$title\" in:title" \
            --json number \
            --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --repo "$REPOSITORY" \
              --comment "Production recovered and the scheduled smoke test passed: $RUN_URL"
          fi
