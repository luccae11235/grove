name: Export standalone project

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project id from projects/manifest.json
        required: true
        default: grove-tree-core
        type: string
      site_url:
        description: Public Grove HTTPS origin
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm projects:validate
      - name: Export project
        run: pnpm projects:export --project "${{ inputs.project }}" --site-url "${{ inputs.site_url }}" --output project-export
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}
          path: project-export
          if-no-files-found: error
