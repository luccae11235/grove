name: Release policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-branch:
    name: Approved release source
    runs-on: ubuntu-latest
    steps:
      - name: Require a release or hotfix branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          case "$HEAD_BRANCH" in
            develop|release/*|hotfix/*) ;;
            *)
              echo "Pull requests into main must come from develop, release/*, or hotfix/*."
              exit 1
              ;;
          esac
