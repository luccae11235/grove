<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="representation-mobile-title representation-mobile-desc">
  <title id="representation-mobile-title">Armazenamento tabular comparado à aproximação de funções</title>
  <desc id="representation-mobile-desc">O painel tabular armazena cada valor de estado-ação em uma célula separada da tabela; a entrada do estado s dois com a ação a dois contém 0,82. O painel de aproximação de funções envia o mesmo par estado-ação por uma rede neural e produz a estimativa aprendida 0,82.</desc>

  <defs>
    <marker id="representation-mobile-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#0b8f55"/>
    </marker>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .math { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1.4px; }
      .wire { fill: none; stroke: #b8c5be; stroke-width: 2.2; stroke-linecap: round; }
      .node { fill: #eef7f2; stroke: #0b8f55; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1024" height="1536" fill="#ffffff"/>
  <rect x="20" y="20" width="984" height="1496" rx="34" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>

  <g aria-label="Tabular ação-value representation">
    <rect x="54" y="48" width="916" height="674" rx="28" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>
    <text x="94" y="112" class="sans" font-size="38" font-weight="700" fill="#17231e">Tabular</text>
    <text x="512" y="165" class="label" text-anchor="middle" fill="#157451">TABELA Q</text>

    <rect x="120" y="190" width="784" height="410" rx="24" fill="#ffffff" stroke="#0b8f55" stroke-width="3"/>
    <path d="M120 214Q120 190 144 190H880Q904 190 904 214V270H120Z" fill="#eef7f2"/>
    <text x="512" y="244" class="math" font-size="48" text-anchor="middle" fill="#17231e">Q(s, a)</text>

    <line x1="120" y1="270" x2="904" y2="270" stroke="#e1e9e4" stroke-width="2"/>
    <line x1="330" y1="270" x2="330" y2="600" stroke="#e1e9e4" stroke-width="2"/>
    <line x1="617" y1="270" x2="617" y2="600" stroke="#e1e9e4" stroke-width="2"/>
    <line x1="120" y1="340" x2="904" y2="340" stroke="#e1e9e4" stroke-width="2"/>
    <line x1="120" y1="426" x2="904" y2="426" stroke="#e1e9e4" stroke-width="2"/>
    <line x1="120" y1="512" x2="904" y2="512" stroke="#e1e9e4" stroke-width="2"/>

    <text x="225" y="314" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#65736c">ESTADO</text>
    <text x="474" y="314" class="math" font-size="30" text-anchor="middle" fill="#65736c">a₁</text>
    <text x="760" y="314" class="math" font-size="30" text-anchor="middle" fill="#65736c">a₂</text>
    <text x="225" y="392" class="math" font-size="31" text-anchor="middle" fill="#17231e">s₁</text>
    <text x="474" y="392" class="sans" font-size="27" text-anchor="middle" fill="#65736c">0.14</text>
    <text x="760" y="392" class="sans" font-size="27" text-anchor="middle" fill="#65736c">0.46</text>

    <rect x="627" y="436" width="267" height="66" rx="15" fill="#eef7f2" stroke="#0b8f55" stroke-width="2.5"/>
    <text x="225" y="478" class="math" font-size="31" text-anchor="middle" fill="#17231e">s₂</text>
    <text x="474" y="478" class="sans" font-size="27" text-anchor="middle" fill="#65736c">0.31</text>
    <text x="760" y="478" class="sans" font-size="30" font-weight="700" text-anchor="middle" fill="#157451">0.82</text>
    <text x="225" y="564" class="math" font-size="31" text-anchor="middle" fill="#17231e">s₃</text>
    <text x="474" y="564" class="sans" font-size="27" text-anchor="middle" fill="#65736c">0.55</text>
    <text x="760" y="564" class="sans" font-size="27" text-anchor="middle" fill="#65736c">0.27</text>

    <text x="512" y="666" class="math" font-size="36" text-anchor="middle" fill="#17231e">Q(s₂, a₂) = 0,82</text>
  </g>

  <g aria-label="A neural network approximates the ação-value function">
    <rect x="54" y="758" width="916" height="730" rx="28" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>
    <text x="94" y="822" class="sans" font-size="38" font-weight="700" fill="#17231e">Aproximação de funções</text>

    <text x="160" y="920" class="math" font-size="30" text-anchor="middle" fill="#65736c">(s, a)</text>
    <text x="515" y="920" class="math" font-size="32" text-anchor="middle" fill="#157451">f<tspan baseline-shift="sub" font-size="20">θ</tspan></text>
    <text x="838" y="920" class="label" font-size="21" text-anchor="middle" fill="#65736c">VALOR</text>

    <circle cx="160" cy="1050" r="47" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <circle cx="160" cy="1200" r="47" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <text x="160" y="1061" class="math" font-size="41" text-anchor="middle" fill="#17231e">s₂</text>
    <text x="160" y="1211" class="math" font-size="41" text-anchor="middle" fill="#17231e">a₂</text>

    <g aria-hidden="true">
      <path d="M207 1050L348 982M207 1050L348 1077M207 1050L348 1172M207 1050L348 1267M207 1200L348 982M207 1200L348 1077M207 1200L348 1172M207 1200L348 1267" class="wire"/>
      <path d="M374 982L514 1022M374 982L514 1124M374 982L514 1226M374 1077L514 1022M374 1077L514 1124M374 1077L514 1226M374 1172L514 1022M374 1172L514 1124M374 1172L514 1226M374 1267L514 1022M374 1267L514 1124M374 1267L514 1226" class="wire"/>
      <path d="M540 1022L672 1124M540 1124L672 1124M540 1226L672 1124" class="wire"/>
    </g>

    <circle cx="361" cy="982" r="14" class="node"/>
    <circle cx="361" cy="1077" r="14" class="node"/>
    <circle cx="361" cy="1172" r="14" class="node"/>
    <circle cx="361" cy="1267" r="14" class="node"/>
    <circle cx="527" cy="1022" r="14" class="node"/>
    <circle cx="527" cy="1124" r="14" class="node"/>
    <circle cx="527" cy="1226" r="14" class="node"/>
    <circle cx="685" cy="1124" r="18" class="node"/>

    <path d="M703 1124H738" fill="none" stroke="#0b8f55" stroke-width="4" stroke-linecap="round" marker-end="url(#representation-mobile-arrow)"/>
    <rect x="752" y="1044" width="172" height="160" rx="24" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <text x="838" y="1096" class="math" font-size="34" text-anchor="middle" fill="#17231e">Q<tspan baseline-shift="sub" font-size="21">θ</tspan></text>
    <text x="838" y="1159" class="sans" font-size="34" font-weight="700" text-anchor="middle" fill="#157451">0.82</text>

    <text x="512" y="1418" class="math" font-size="36" text-anchor="middle" fill="#17231e">(s₂, a₂) → Q<tspan baseline-shift="sub" font-size="22">θ</tspan>(s₂, a₂)</text>
  </g>
</svg>
