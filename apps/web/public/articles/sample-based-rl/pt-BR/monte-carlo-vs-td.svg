<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="1040" viewBox="0 0 1774 1040" role="img" aria-labelledby="mc-td-title mc-td-desc">
  <title id="mc-td-title">Monte Carlo atualiza após o episódio; TD pode atualizar durante a amostragem</title>
  <desc id="mc-td-desc">Duas cópias alinhadas da mesma trajetória de estados, ações e recompensas comparam o momento da atualização. Monte Carlo aplica a atualização U ao chegar ao estado terminal e transforma a política pi zero em pi um. O método de diferenças temporais pode aplicar U após transições intermediárias e alterar a política repetidamente enquanto o episódio ainda está sendo amostrado.</desc>

  <defs>
    <marker id="mc-td-arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#0b8f55"/>
    </marker>
    <marker id="mc-td-arrow-neutral" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#65736c"/>
    </marker>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .math { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
      .token { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 38px; text-anchor: middle; dominant-baseline: middle; }
      .step-arrow { font-family: Inter, Arial, sans-serif; font-size: 30px; fill: #65736c; text-anchor: middle; dominant-baseline: middle; }
      .policy { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 38px; text-anchor: middle; dominant-baseline: middle; }
    </style>

    <g id="mc-td-trajectory">
      <g class="token" fill="#17231e">
        <text x="0" y="0">s₀</text>
        <text x="340" y="0">s₁</text>
        <text x="680" y="0">s₂</text>
        <text x="960" y="0">s<tspan baseline-shift="sub" font-size="23">T</tspan></text>
      </g>
      <g class="token" fill="#65736c">
        <text x="105" y="0">a₀</text>
        <text x="445" y="0">a₁</text>
      </g>
      <g fill="#eef7f2" stroke="#0b8f55" stroke-width="2.5">
        <rect x="176" y="-35" width="88" height="70" rx="19"/>
        <rect x="516" y="-35" width="88" height="70" rx="19"/>
        <rect x="806" y="-35" width="88" height="70" rx="19"/>
      </g>
      <g class="token" fill="#157451" font-weight="700">
        <text x="220" y="0">r₁</text>
        <text x="560" y="0">r₂</text>
        <text x="850" y="0">r<tspan baseline-shift="sub" font-size="23">T</tspan></text>
      </g>
      <g class="step-arrow">
        <text x="52" y="0">→</text>
        <text x="157" y="0">→</text>
        <text x="287" y="0">→</text>
        <text x="392" y="0">→</text>
        <text x="497" y="0">→</text>
        <text x="627" y="0">→</text>
        <text x="735" y="0">→</text>
        <text x="765" y="0">···</text>
        <text x="795" y="0">→</text>
        <text x="927" y="0">→</text>
      </g>
    </g>
  </defs>

  <rect width="1774" height="1040" fill="#ffffff"/>
  <rect x="20" y="20" width="1734" height="1000" rx="34" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>
  <line x1="70" y1="520" x2="1704" y2="520" stroke="#e1e9e4" stroke-width="2"/>

  <g aria-label="Monte Carlo applies one update after the terminal state">
    <text x="86" y="104" class="sans" font-size="36" font-weight="700" fill="#17231e">Monte Carlo</text>

    <rect x="86" y="210" width="86" height="70" rx="22" fill="#eef7f2" stroke="#0b8f55" stroke-width="2.5"/>
    <text x="129" y="247" class="policy" fill="#157451">π₀</text>
    <path d="M172 245H198" fill="none" stroke="#0b8f55" stroke-width="3.5" marker-end="url(#mc-td-arrow-green)"/>
    <rect x="212" y="185" width="150" height="120" rx="24" fill="#ffffff" stroke="#0b8f55" stroke-width="2.5"/>
    <text x="287" y="255" class="sans" font-size="29" font-weight="700" text-anchor="middle" fill="#17231e">MDP</text>
    <path d="M362 245H408" fill="none" stroke="#0b8f55" stroke-width="3.5" marker-end="url(#mc-td-arrow-green)"/>

    <use href="#mc-td-trajectory" transform="translate(430 245)"/>
    <text x="1390" y="178" class="sans" font-size="21" fill="#65736c" text-anchor="middle">episódio termina</text>

    <path d="M1390 286V342" fill="none" stroke="#0b8f55" stroke-width="3.5" marker-end="url(#mc-td-arrow-green)"/>
    <circle cx="1390" cy="393" r="43" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <text x="1390" y="395" class="math" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#157451">U</text>
    <path d="M1433 393H1492" fill="none" stroke="#0b8f55" stroke-width="3.5" marker-end="url(#mc-td-arrow-green)"/>
    <rect x="1506" y="358" width="120" height="70" rx="22" fill="#eef7f2" stroke="#0b8f55" stroke-width="2.5"/>
    <text x="1566" y="395" class="policy" fill="#157451">π₁</text>
  </g>

  <g aria-label="Temporal Difference applies updates after intermediate transitions">
    <text x="86" y="602" class="sans" font-size="36" font-weight="700" fill="#17231e">Diferenças temporais</text>

    <rect x="86" y="710" width="86" height="70" rx="22" fill="#eef7f2" stroke="#0b8f55" stroke-width="2.5"/>
    <text x="129" y="747" class="policy" fill="#157451">π₀</text>
    <path d="M172 745H198" fill="none" stroke="#0b8f55" stroke-width="3.5" marker-end="url(#mc-td-arrow-green)"/>
    <rect x="212" y="685" width="150" height="120" rx="24" fill="#ffffff" stroke="#0b8f55" stroke-width="2.5"/>
    <text x="287" y="755" class="sans" font-size="29" font-weight="700" text-anchor="middle" fill="#17231e">MDP</text>
    <path d="M362 745H408" fill="none" stroke="#0b8f55" stroke-width="3.5" marker-end="url(#mc-td-arrow-green)"/>

    <use href="#mc-td-trajectory" transform="translate(430 745)"/>

    <g aria-label="First update after reaching estado s one">
      <path d="M770 786V850" fill="none" stroke="#0b8f55" stroke-width="3.5" marker-end="url(#mc-td-arrow-green)"/>
      <circle cx="770" cy="892" r="36" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
      <text x="770" y="894" class="math" font-size="43" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#157451">U</text>
      <path d="M770 928V947" fill="none" stroke="#0b8f55" stroke-width="3" marker-end="url(#mc-td-arrow-green)"/>
      <rect x="718" y="958" width="104" height="48" rx="18" fill="#ffffff" stroke="#0b8f55" stroke-width="2.5"/>
      <text x="770" y="984" class="policy" font-size="31" fill="#157451">π₁</text>
    </g>

    <g aria-label="Second update after reaching estado s two">
      <path d="M1110 786V850" fill="none" stroke="#0b8f55" stroke-width="3.5" marker-end="url(#mc-td-arrow-green)"/>
      <circle cx="1110" cy="892" r="36" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
      <text x="1110" y="894" class="math" font-size="43" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#157451">U</text>
      <path d="M1110 928V947" fill="none" stroke="#0b8f55" stroke-width="3" marker-end="url(#mc-td-arrow-green)"/>
      <rect x="1058" y="958" width="104" height="48" rx="18" fill="#ffffff" stroke="#0b8f55" stroke-width="2.5"/>
      <text x="1110" y="984" class="policy" font-size="31" fill="#157451">π₂</text>
    </g>

    <g aria-label="Another update after reaching the terminal state">
      <path d="M1390 786V850" fill="none" stroke="#0b8f55" stroke-width="3.5" marker-end="url(#mc-td-arrow-green)"/>
      <circle cx="1390" cy="892" r="36" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
      <text x="1390" y="894" class="math" font-size="43" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#157451">U</text>
      <path d="M1390 928V947" fill="none" stroke="#0b8f55" stroke-width="3" marker-end="url(#mc-td-arrow-green)"/>
      <rect x="1338" y="958" width="104" height="48" rx="18" fill="#ffffff" stroke="#0b8f55" stroke-width="2.5"/>
      <text x="1390" y="984" class="policy" font-size="31" fill="#157451">π₃</text>
    </g>
  </g>
</svg>
