<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="700" viewBox="0 0 1774 700" role="img" aria-labelledby="slc-title slc-desc">
  <title id="slc-title">O ciclo do aprendizado por reforço baseado em amostras</title>
  <desc id="slc-desc">Uma política pi atua em um ciclo de MDP entre agente e ambiente. O ciclo produz várias trajetórias amostradas, que alternam estados, ações e recompensas. A regra de atualização U aprende com essas amostras e produz uma política melhor pi linha, que retorna ao mesmo MDP para repetir o ciclo.</desc>

  <defs>
    <marker id="slc-arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11Z" fill="#0b8f55"/>
    </marker>
  </defs>

  <rect width="1774" height="700" fill="#ffffff"/>
  <rect x="20" y="20" width="1734" height="660" rx="34" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>

  <!-- The same MDP remains the source of every sample. -->
  <g font-family="Inter, Arial, sans-serif">
    <text x="278" y="102" fill="#17231e" font-size="31" font-weight="650" text-anchor="middle">MDP</text>

    <rect x="66" y="196" width="186" height="130" rx="25" fill="#eef7f2" stroke="#157451" stroke-width="3"/>
    <text x="159" y="248" fill="#17231e" font-size="31" text-anchor="middle">Agente</text>
    <rect x="124" y="270" width="70" height="42" rx="21" fill="#ffffff" stroke="#0b8f55" stroke-width="2.5"/>
    <text x="159" y="293" fill="#0b8f55" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-style="italic" text-anchor="middle" dominant-baseline="middle">π</text>

    <rect x="304" y="196" width="186" height="130" rx="25" fill="#eef7f2" stroke="#157451" stroke-width="3"/>
    <text x="397" y="269" fill="#17231e" font-size="31" text-anchor="middle">Ambiente</text>

    <path d="M252 222C272 176 284 176 304 222" fill="none" stroke="#0b8f55" stroke-width="4" stroke-linecap="round" marker-end="url(#slc-arrow-green)"/>
    <text x="278" y="165" fill="#65736c" font-size="22" text-anchor="middle">ação</text>
    <path d="M304 302C284 350 272 350 252 302" fill="none" stroke="#0b8f55" stroke-width="4" stroke-linecap="round" marker-end="url(#slc-arrow-green)"/>
    <text x="278" y="382" fill="#65736c" font-size="22" text-anchor="middle">estado + recompensa</text>
  </g>

  <path d="M516 261H570" fill="none" stroke="#0b8f55" stroke-width="4" stroke-linecap="round" marker-end="url(#slc-arrow-green)"/>

  <!-- Repeated abstract traces communicate many samples without making their count the message. -->
  <g font-family="Inter, Arial, sans-serif">
    <text x="875" y="102" fill="#17231e" font-size="31" font-weight="650" text-anchor="middle">trajetórias amostradas</text>

    <g fill="none" stroke="#e1e9e4" stroke-width="2">
      <line x1="594" y1="226" x2="1156" y2="226"/>
      <line x1="594" y1="347" x2="1156" y2="347"/>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic" text-anchor="middle" dominant-baseline="middle">
      <g fill="#17231e">
        <text x="610" y="200">s₀</text><text x="830" y="200">s₁</text><text x="1050" y="200">s₂</text>
        <text x="610" y="321">s₀</text><text x="830" y="321">s₁</text><text x="1050" y="321">s₂</text>
      </g>
      <g fill="#65736c">
        <text x="720" y="200">a₀</text><text x="940" y="200">a₁</text>
        <text x="720" y="321">a₀</text><text x="940" y="321">a₁</text>
      </g>
      <g fill="#157451" font-weight="650">
        <text x="775" y="200">r₁</text><text x="995" y="200">r₂</text>
        <text x="775" y="321">r₁</text><text x="995" y="321">r₂</text>
      </g>
      <g fill="#65736c" font-family="Inter, Arial, sans-serif" font-size="24" font-style="normal">
        <text x="665" y="200">→</text><text x="748" y="200">→</text><text x="803" y="200">→</text><text x="885" y="200">→</text><text x="968" y="200">→</text><text x="1023" y="200">→</text><text x="1122" y="200">…</text>
        <text x="875" y="260" font-size="32">⋮</text>
        <text x="665" y="321">→</text><text x="748" y="321">→</text><text x="803" y="321">→</text><text x="885" y="321">→</text><text x="968" y="321">→</text><text x="1023" y="321">→</text><text x="1122" y="321">…</text>
      </g>
    </g>
  </g>

  <path d="M1178 261H1230" fill="none" stroke="#0b8f55" stroke-width="4" stroke-linecap="round" marker-end="url(#slc-arrow-green)"/>

  <!-- The update stays abstract because different algorithms instantiate U differently. -->
  <g>
    <circle cx="1302" cy="261" r="61" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <text x="1302" y="264" fill="#157451" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-style="italic" text-anchor="middle" dominant-baseline="middle">U</text>
    <text x="1302" y="356" fill="#65736c" font-family="Inter, Arial, sans-serif" font-size="23" text-anchor="middle">atualização</text>
  </g>

  <path d="M1378 261H1434" fill="none" stroke="#0b8f55" stroke-width="4" stroke-linecap="round" marker-end="url(#slc-arrow-green)"/>

  <g>
    <rect x="1464" y="176" width="230" height="170" rx="30" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <text x="1579" y="239" fill="#65736c" font-family="Inter, Arial, sans-serif" font-size="23" text-anchor="middle">política melhor</text>
    <text x="1579" y="300" fill="#0b8f55" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-style="italic" text-anchor="middle" dominant-baseline="middle">π′</text>
  </g>

  <!-- A tighter return path preserves the cycle without leaving an empty second panel. -->
  <path d="M1579 374V478Q1579 536 1521 536H217Q159 536 159 478V350" fill="none" stroke="#157451" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#slc-arrow-green)"/>
  <text x="869" y="584" fill="#65736c" font-family="Inter, Arial, sans-serif" font-size="23" text-anchor="middle">repetir com a política melhorada</text>
</svg>
