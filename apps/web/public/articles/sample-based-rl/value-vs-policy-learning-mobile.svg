<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="value-policy-mobile-title value-policy-mobile-desc">
  <title id="value-policy-mobile-title">Value-based learning uses values before acting; policy-based learning represents action probabilities directly</title>
  <desc id="value-policy-mobile-desc">Both agents receive the same state s and can move left or right. The value-based agent first learns a Q table of expected returns, then a policy chooses the action with the largest Q value, producing right. The policy-based agent learns pi theta directly, mapping the state to a 30 percent chance of moving left and a 70 percent chance of moving right without an intermediate value table.</desc>
  <defs>
    <marker id="vpm-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 11 6 1 11Z" fill="#65736c"/>
    </marker>
    <marker id="vpm-arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 11 6 1 11Z" fill="#0b8f55"/>
    </marker>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .math { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
      .eyebrow { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1.7px; }
    </style>
  </defs>

  <rect width="1024" height="1536" fill="#ffffff"/>
  <rect x="18" y="18" width="988" height="1500" rx="34" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>

  <!-- Value-based: state, value table, derived policy, then action. -->
  <g aria-label="Value-based learning uses an action-value table before the policy chooses">
    <rect x="50" y="48" width="924" height="700" rx="30" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>
    <text x="92" y="106" class="sans" font-size="32" font-weight="700" fill="#17231e">Value-based</text>
    <text x="92" y="143" class="sans" font-size="22" fill="#65736c">Learn expected returns, then choose.</text>

    <text x="92" y="236" class="eyebrow" fill="#65736c">STATE</text>
    <rect x="92" y="258" width="126" height="138" rx="23" fill="#eef7f2"/>
    <text x="155" y="329" class="math" font-size="56" fill="#17231e" text-anchor="middle" dominant-baseline="middle">s</text>
    <path d="M218 327H268" fill="none" stroke="#65736c" stroke-width="3" stroke-linecap="round" marker-end="url(#vpm-arrow)"/>

    <text x="288" y="193" class="eyebrow" fill="#157451">LEARNED ACTION VALUES</text>
    <rect x="268" y="215" width="650" height="292" rx="26" fill="#ffffff" stroke="#0b8f55" stroke-width="3"/>
    <rect x="268" y="215" width="650" height="82" rx="26" fill="#eef7f2"/>
    <path d="M268 271V297H918V271" fill="#eef7f2"/>
    <text x="593" y="265" class="math" font-size="43" fill="#17231e" text-anchor="middle">Q(s, a)</text>
    <text x="302" y="326" class="sans" font-size="18" font-weight="700" letter-spacing="1.1" fill="#65736c">ACTION</text>
    <text x="878" y="326" class="sans" font-size="18" font-weight="700" letter-spacing="1.1" fill="#65736c" text-anchor="end">EXPECTED RETURN</text>

    <rect x="296" y="344" width="594" height="62" rx="16" fill="#ffffff" stroke="#e1e9e4" stroke-width="2"/>
    <text x="326" y="383" class="math" font-size="27" fill="#17231e">a<tspan baseline-shift="sub" font-size="16">1</tspan></text>
    <text x="372" y="383" class="sans" font-size="23" fill="#65736c">left</text>
    <text x="856" y="383" class="sans" font-size="25" fill="#65736c" text-anchor="end">0.3</text>

    <rect x="296" y="422" width="594" height="64" rx="16" fill="#eef7f2" stroke="#0b8f55" stroke-width="2"/>
    <text x="326" y="462" class="math" font-size="27" font-weight="700" fill="#157451">a<tspan baseline-shift="sub" font-size="16">2</tspan></text>
    <text x="372" y="462" class="sans" font-size="23" font-weight="700" fill="#157451">right</text>
    <text x="856" y="462" class="sans" font-size="25" font-weight="700" fill="#157451" text-anchor="end">0.8</text>

    <path d="M535 507V548" fill="none" stroke="#0b8f55" stroke-width="4" stroke-linecap="round" marker-end="url(#vpm-arrow-green)"/>
    <rect x="350" y="552" width="320" height="112" rx="24" fill="#ffffff" stroke="#0b8f55" stroke-width="3"/>
    <text x="510" y="583" class="eyebrow" fill="#65736c" text-anchor="middle">POLICY · CHOOSE MAX Q</text>
    <text x="510" y="630" class="math" font-size="36" fill="#17231e" text-anchor="middle">π<tspan baseline-shift="sub" font-size="21">Q</tspan>(s)</text>

    <path d="M670 608H712" fill="none" stroke="#0b8f55" stroke-width="4" stroke-linecap="round" marker-end="url(#vpm-arrow-green)"/>
    <rect x="716" y="552" width="164" height="112" rx="24" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <text x="798" y="598" class="math" font-size="32" font-weight="700" fill="#157451" text-anchor="middle">a<tspan baseline-shift="sub" font-size="19">2</tspan></text>
    <text x="798" y="638" class="sans" font-size="22" font-weight="700" fill="#157451" text-anchor="middle">right</text>

    <text x="512" y="710" class="sans" font-size="23" font-weight="650" fill="#17231e" text-anchor="middle">values <tspan fill="#65736c">→</tspan> policy <tspan fill="#65736c">→</tspan> action</text>
  </g>

  <!-- Policy-based: state flows directly through the learned policy to a distribution. -->
  <g aria-label="Policy-based learning maps the state directly to action probabilities">
    <rect x="50" y="780" width="924" height="708" rx="30" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>
    <text x="92" y="838" class="sans" font-size="32" font-weight="700" fill="#17231e">Policy-based</text>
    <text x="92" y="875" class="sans" font-size="22" fill="#65736c">Learn the action probabilities directly.</text>

    <text x="92" y="1017" class="eyebrow" fill="#65736c">STATE</text>
    <rect x="92" y="1039" width="126" height="138" rx="23" fill="#eef7f2"/>
    <text x="155" y="1110" class="math" font-size="56" fill="#17231e" text-anchor="middle" dominant-baseline="middle">s</text>
    <path d="M218 1108H292" fill="none" stroke="#65736c" stroke-width="3" stroke-linecap="round" marker-end="url(#vpm-arrow)"/>

    <rect x="294" y="1008" width="250" height="200" rx="30" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <text x="419" y="1050" class="eyebrow" fill="#157451" text-anchor="middle">LEARNED POLICY</text>
    <text x="419" y="1113" class="math" font-size="43" fill="#17231e" text-anchor="middle">π<tspan baseline-shift="sub" font-size="25">θ</tspan>(a | s)</text>
    <text x="419" y="1161" class="sans" font-size="20" fill="#65736c" text-anchor="middle">the decision rule</text>

    <text x="738" y="951" class="eyebrow" fill="#65736c" text-anchor="middle">ACTION PROBABILITIES</text>
    <path d="M544 1077H590Q616 1077 640 1038" fill="none" stroke="#65736c" stroke-width="3" stroke-linecap="round" marker-end="url(#vpm-arrow)"/>
    <path d="M544 1139H590Q616 1139 640 1263" fill="none" stroke="#0b8f55" stroke-width="4" stroke-linecap="round" marker-end="url(#vpm-arrow-green)"/>

    <rect x="644" y="982" width="270" height="122" rx="24" fill="#ffffff" stroke="#e1e9e4" stroke-width="2"/>
    <text x="676" y="1033" class="math" font-size="30" fill="#17231e">a<tspan baseline-shift="sub" font-size="18">1</tspan></text>
    <text x="723" y="1033" class="sans" font-size="23" fill="#65736c">left</text>
    <text x="882" y="1033" class="sans" font-size="28" fill="#65736c" text-anchor="end">30%</text>
    <rect x="676" y="1062" width="206" height="12" rx="6" fill="#eef7f2"/>
    <rect x="676" y="1062" width="62" height="12" rx="6" fill="#65736c" opacity="0.5"/>

    <rect x="644" y="1210" width="270" height="136" rx="24" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <text x="676" y="1265" class="math" font-size="30" font-weight="700" fill="#157451">a<tspan baseline-shift="sub" font-size="18">2</tspan></text>
    <text x="723" y="1265" class="sans" font-size="23" font-weight="700" fill="#157451">right</text>
    <text x="882" y="1265" class="sans" font-size="28" font-weight="700" fill="#157451" text-anchor="end">70%</text>
    <rect x="676" y="1300" width="206" height="12" rx="6" fill="#ffffff"/>
    <rect x="676" y="1300" width="144" height="12" rx="6" fill="#0b8f55"/>

    <text x="512" y="1435" class="sans" font-size="23" font-weight="650" fill="#17231e" text-anchor="middle">state <tspan fill="#65736c">→</tspan> policy <tspan fill="#65736c">→</tspan> action probabilities</text>
  </g>
</svg>
