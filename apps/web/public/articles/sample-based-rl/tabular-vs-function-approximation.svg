<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="representation-title representation-desc">
  <title id="representation-title">Tabular storage compared with function approximation</title>
  <desc id="representation-desc">The tabular panel stores each state-action value in a separate table cell, with the entry for state s two and action a two containing 0.82. The function-approximation panel sends the same state-action pair through a neural network and produces the learned estimate 0.82.</desc>

  <defs>
    <marker id="representation-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#0b8f55"/>
    </marker>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .math { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1.5px; }
      .wire { fill: none; stroke: #b8c5be; stroke-width: 2.2; stroke-linecap: round; }
      .node { fill: #eef7f2; stroke: #0b8f55; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1774" height="887" fill="#ffffff"/>
  <rect x="20" y="20" width="1734" height="847" rx="34" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>

  <g aria-label="Tabular action-value representation">
    <rect x="70" y="54" width="797" height="779" rx="28" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>
    <text x="116" y="126" class="sans" font-size="36" font-weight="700" fill="#17231e">Tabular</text>
    <text x="468" y="196" class="label" text-anchor="middle" fill="#157451">Q TABLE</text>

    <rect x="178" y="220" width="580" height="410" rx="24" fill="#ffffff" stroke="#0b8f55" stroke-width="3"/>
    <path d="M178 244Q178 220 202 220H734Q758 220 758 244V300H178Z" fill="#eef7f2"/>
    <text x="468" y="274" class="math" font-size="48" text-anchor="middle" fill="#17231e">Q(s, a)</text>

    <line x1="178" y1="300" x2="758" y2="300" stroke="#e1e9e4" stroke-width="2"/>
    <line x1="338" y1="300" x2="338" y2="630" stroke="#e1e9e4" stroke-width="2"/>
    <line x1="548" y1="300" x2="548" y2="630" stroke="#e1e9e4" stroke-width="2"/>
    <line x1="178" y1="370" x2="758" y2="370" stroke="#e1e9e4" stroke-width="2"/>
    <line x1="178" y1="456" x2="758" y2="456" stroke="#e1e9e4" stroke-width="2"/>
    <line x1="178" y1="542" x2="758" y2="542" stroke="#e1e9e4" stroke-width="2"/>

    <text x="258" y="344" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#65736c">STATE</text>
    <text x="443" y="344" class="math" font-size="30" text-anchor="middle" fill="#65736c">a₁</text>
    <text x="653" y="344" class="math" font-size="30" text-anchor="middle" fill="#65736c">a₂</text>

    <text x="258" y="422" class="math" font-size="31" text-anchor="middle" fill="#17231e">s₁</text>
    <text x="443" y="422" class="sans" font-size="27" text-anchor="middle" fill="#65736c">0.14</text>
    <text x="653" y="422" class="sans" font-size="27" text-anchor="middle" fill="#65736c">0.46</text>

    <rect x="558" y="466" width="190" height="66" rx="15" fill="#eef7f2" stroke="#0b8f55" stroke-width="2.5"/>
    <text x="258" y="508" class="math" font-size="31" text-anchor="middle" fill="#17231e">s₂</text>
    <text x="443" y="508" class="sans" font-size="27" text-anchor="middle" fill="#65736c">0.31</text>
    <text x="653" y="508" class="sans" font-size="30" font-weight="700" text-anchor="middle" fill="#157451">0.82</text>

    <text x="258" y="594" class="math" font-size="31" text-anchor="middle" fill="#17231e">s₃</text>
    <text x="443" y="594" class="sans" font-size="27" text-anchor="middle" fill="#65736c">0.55</text>
    <text x="653" y="594" class="sans" font-size="27" text-anchor="middle" fill="#65736c">0.27</text>

    <text x="468" y="704" class="math" font-size="36" text-anchor="middle" fill="#17231e">Q(s₂, a₂) = 0.82</text>
  </g>

  <g aria-label="A neural network approximates the action-value function">
    <rect x="907" y="54" width="797" height="779" rx="28" fill="#ffffff" stroke="#e1e9e4" stroke-width="3"/>
    <text x="953" y="126" class="sans" font-size="36" font-weight="700" fill="#17231e">Function approximation</text>

    <text x="1048" y="232" class="math" font-size="30" text-anchor="middle" fill="#65736c">(s, a)</text>
    <text x="1340" y="232" class="math" font-size="32" text-anchor="middle" fill="#157451">f<tspan baseline-shift="sub" font-size="20">θ</tspan></text>
    <text x="1600" y="232" class="label" font-size="21" text-anchor="middle" fill="#65736c">VALUE</text>

    <circle cx="1048" cy="372" r="48" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <circle cx="1048" cy="512" r="48" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <text x="1048" y="383" class="math" font-size="42" text-anchor="middle" fill="#17231e">s₂</text>
    <text x="1048" y="523" class="math" font-size="42" text-anchor="middle" fill="#17231e">a₂</text>

    <g aria-hidden="true">
      <path d="M1096 372L1198 318M1096 372L1198 402M1096 372L1198 486M1096 372L1198 570M1096 512L1198 318M1096 512L1198 402M1096 512L1198 486M1096 512L1198 570" class="wire"/>
      <path d="M1222 318L1328 350M1222 318L1328 442M1222 318L1328 534M1222 402L1328 350M1222 402L1328 442M1222 402L1328 534M1222 486L1328 350M1222 486L1328 442M1222 486L1328 534M1222 570L1328 350M1222 570L1328 442M1222 570L1328 534" class="wire"/>
      <path d="M1352 350L1458 442M1352 442L1458 442M1352 534L1458 442" class="wire"/>
    </g>

    <circle cx="1210" cy="318" r="13" class="node"/>
    <circle cx="1210" cy="402" r="13" class="node"/>
    <circle cx="1210" cy="486" r="13" class="node"/>
    <circle cx="1210" cy="570" r="13" class="node"/>
    <circle cx="1340" cy="350" r="13" class="node"/>
    <circle cx="1340" cy="442" r="13" class="node"/>
    <circle cx="1340" cy="534" r="13" class="node"/>
    <circle cx="1470" cy="442" r="17" class="node"/>

    <path d="M1487 442H1518" fill="none" stroke="#0b8f55" stroke-width="4" stroke-linecap="round" marker-end="url(#representation-arrow)"/>
    <rect x="1532" y="362" width="136" height="160" rx="24" fill="#eef7f2" stroke="#0b8f55" stroke-width="3"/>
    <text x="1600" y="414" class="math" font-size="34" text-anchor="middle" fill="#17231e">Q<tspan baseline-shift="sub" font-size="21">θ</tspan></text>
    <text x="1600" y="477" class="sans" font-size="34" font-weight="700" text-anchor="middle" fill="#157451">0.82</text>

    <text x="1306" y="704" class="math" font-size="36" text-anchor="middle" fill="#17231e">(s₂, a₂) → Q<tspan baseline-shift="sub" font-size="22">θ</tspan>(s₂, a₂)</text>
  </g>
</svg>
