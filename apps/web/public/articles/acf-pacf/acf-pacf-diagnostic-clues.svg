<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
  <title id="title">Idealized ACF and PACF clues for autoregressive and moving-average models</title>
  <desc id="description">A two-by-two comparison. For an AR one process, the ACF bars decay across lags while the PACF has one large bar and then stops. For an MA one process, the ACF has one large bar and then stops while the PACF alternates above and below zero with decreasing size. A note says these are idealized population patterns and sample estimates are noisier.</desc>

  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="48" y="48" fill="#17231e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="650">A classic diagnostic clue</text>
  <text x="48" y="78" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">The clearer stopping point often appears in a different function</text>

  <text x="425" y="123" fill="#17231e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">ACF</text>
  <text x="775" y="123" fill="#17231e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">PACF</text>

  <rect x="30" y="142" width="940" height="190" rx="18" fill="#f5f8f6" stroke="#dce5e0"/>
  <text x="54" y="182" fill="#17231e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">AR(1)-like</text>
  <text x="54" y="207" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">each value carries the</text>
  <text x="54" y="226" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">previous value forward</text>

  <line x1="292" y1="280" x2="558" y2="280" stroke="#aebbb4" stroke-width="1.4"/>
  <rect x="310" y="194" width="22" height="86" rx="3" fill="#157451"/>
  <rect x="352" y="211" width="22" height="69" rx="3" fill="#2f8568"/>
  <rect x="394" y="225" width="22" height="55" rx="3" fill="#4a957b"/>
  <rect x="436" y="236" width="22" height="44" rx="3" fill="#67a68d"/>
  <rect x="478" y="245" width="22" height="35" rx="3" fill="#84b7a2"/>
  <rect x="520" y="252" width="22" height="28" rx="3" fill="#a0c6b5"/>
  <path d="M 324 181 C 385 153, 472 160, 534 235" fill="none" stroke="#157451" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="425" y="170" fill="#157451" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" text-anchor="middle">propagation trails away</text>
  <text x="321" y="303" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">1</text>
  <text x="531" y="303" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">6</text>
  <text x="425" y="318" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">lag</text>

  <line x1="642" y1="280" x2="908" y2="280" stroke="#aebbb4" stroke-width="1.4"/>
  <rect x="660" y="194" width="22" height="86" rx="3" fill="#d89525"/>
  <rect x="702" y="277" width="22" height="3" rx="1.5" fill="#d7c39b"/>
  <rect x="744" y="277" width="22" height="3" rx="1.5" fill="#d7c39b"/>
  <rect x="786" y="277" width="22" height="3" rx="1.5" fill="#d7c39b"/>
  <rect x="828" y="277" width="22" height="3" rx="1.5" fill="#d7c39b"/>
  <rect x="870" y="277" width="22" height="3" rx="1.5" fill="#d7c39b"/>
  <path d="M 671 181 L 671 158 L 718 158" fill="none" stroke="#b56d00" stroke-width="1.8"/>
  <text x="727" y="163" fill="#9b6209" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">clear stop after lag 1</text>
  <text x="671" y="303" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">1</text>
  <text x="881" y="303" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">6</text>
  <text x="775" y="318" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">lag</text>

  <rect x="30" y="350" width="940" height="210" rx="18" fill="#fffaf0" stroke="#eadfc9"/>
  <text x="54" y="390" fill="#17231e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">MA(1)-like</text>
  <text x="54" y="415" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">each value combines the</text>
  <text x="54" y="434" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">current and previous shock</text>

  <line x1="292" y1="462" x2="558" y2="462" stroke="#aebbb4" stroke-width="1.4"/>
  <rect x="310" y="407" width="22" height="55" rx="3" fill="#157451"/>
  <rect x="352" y="459" width="22" height="3" rx="1.5" fill="#a0c6b5"/>
  <rect x="394" y="459" width="22" height="3" rx="1.5" fill="#a0c6b5"/>
  <rect x="436" y="459" width="22" height="3" rx="1.5" fill="#a0c6b5"/>
  <rect x="478" y="459" width="22" height="3" rx="1.5" fill="#a0c6b5"/>
  <rect x="520" y="459" width="22" height="3" rx="1.5" fill="#a0c6b5"/>
  <path d="M 321 395 L 321 376 L 368 376" fill="none" stroke="#157451" stroke-width="1.8"/>
  <text x="377" y="381" fill="#157451" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">clear stop after lag 1</text>
  <text x="321" y="486" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">1</text>
  <text x="531" y="486" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">6</text>
  <text x="425" y="520" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">lag</text>

  <line x1="642" y1="440" x2="908" y2="440" stroke="#aebbb4" stroke-width="1.4"/>
  <rect x="660" y="385" width="22" height="55" rx="3" fill="#d89525"/>
  <rect x="702" y="440" width="22" height="35" rx="3" fill="#d9a64e"/>
  <rect x="744" y="415" width="22" height="25" rx="3" fill="#deb46b"/>
  <rect x="786" y="440" width="22" height="19" rx="3" fill="#e2c083"/>
  <rect x="828" y="426" width="22" height="14" rx="3" fill="#e6ca9b"/>
  <rect x="870" y="440" width="22" height="11" rx="3" fill="#ead4b2"/>
  <path d="M 672 375 C 735 352, 825 370, 881 422" fill="none" stroke="#b56d00" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="775" y="366" fill="#9b6209" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" text-anchor="middle">alternating trail fades</text>
  <text x="671" y="486" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">1</text>
  <text x="881" y="486" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">6</text>
  <text x="775" y="520" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">lag</text>

  <text x="500" y="606" fill="#65736c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">Idealized population patterns · finite samples are noisier and rarely stop this neatly</text>
</svg>
