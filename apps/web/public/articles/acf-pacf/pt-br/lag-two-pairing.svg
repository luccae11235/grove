  <title id="title">Como observações separadas por dois passos formam um conjunto de pares no lag dois</title>
  <desc id="description">Três varreduras destacam x um com x três, x dois com x quatro e x T menos dois com x T. Um valor não selecionado permanece entre os elementos de cada par, e cada par se torna uma linha de uma tabela de vendas com duas colunas.</desc>
