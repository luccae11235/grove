<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title description">
  <title id="title">As observações intermediárias predizem os dois extremos</title>
  <desc id="description">Uma sequência vai de X t, passa pelas observações intermediárias e chega a X t mais n. As observações do meio aparecem agrupadas. Duas setas para fora mostram os mesmos valores intermediários sendo usados para predizer o extremo esquerdo X t e o extremo direito X t mais n.</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#157451"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="50" y="48" fill="#17231e" font-size="25" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Use o meio para predizer os dois extremos</text>
  <text x="50" y="76" fill="#65736c" font-size="14" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Os mesmos valores intermediários alimentam dois modelos lineares distintos</text>

  <path d="M 312 150 C 250 104, 170 112, 136 165" fill="none" stroke="#157451" stroke-width="2.5" marker-end="url(#green-arrow)"/>
  <path d="M 688 150 C 750 104, 830 112, 864 165" fill="none" stroke="#157451" stroke-width="2.5" marker-end="url(#green-arrow)"/>
  <text x="224" y="115" fill="#157451" font-size="13" font-weight="600" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">predizer à esquerda</text>
  <text x="776" y="115" fill="#157451" font-size="13" font-weight="600" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">predizer à direita</text>

  <rect x="50" y="165" width="140" height="112" rx="16" fill="#f5f8f6" stroke="#aebbb4" stroke-width="1.5"/>
  <rect x="810" y="165" width="140" height="112" rx="16" fill="#f5f8f6" stroke="#aebbb4" stroke-width="1.5"/>
  <text x="120" y="233" fill="#17231e" font-size="30" font-weight="500" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, serif" font-style="italic">Xₜ</text>
  <text x="880" y="233" fill="#17231e" font-size="30" font-weight="500" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, serif" font-style="italic">Xₜ₊ₙ</text>

  <rect x="225" y="140" width="550" height="188" rx="20" fill="#e5f3ec" stroke="#157451" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="500" y="174" fill="#157451" font-size="13" font-weight="600" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">VALORES INTERMEDIÁRIOS</text>

  <rect x="255" y="197" width="112" height="82" rx="13" fill="#ffffff" stroke="#b8cbc1" stroke-width="1.5"/>
  <rect x="389" y="197" width="112" height="82" rx="13" fill="#ffffff" stroke="#b8cbc1" stroke-width="1.5"/>
  <rect x="633" y="197" width="112" height="82" rx="13" fill="#ffffff" stroke="#b8cbc1" stroke-width="1.5"/>
  <text x="311" y="247" fill="#17231e" font-size="25" font-weight="500" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, serif" font-style="italic">Xₜ₊₁</text>
  <text x="445" y="247" fill="#17231e" font-size="25" font-weight="500" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, serif" font-style="italic">Xₜ₊₂</text>
  <text x="567" y="247" fill="#65736c" font-size="28" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">…</text>
  <text x="689" y="247" fill="#17231e" font-size="25" font-weight="500" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Georgia, serif" font-style="italic">Xₜ₊ₙ₋₁</text>

  <text x="120" y="309" fill="#65736c" font-size="13" font-weight="500" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">extremo esquerdo</text>
  <text x="880" y="309" fill="#65736c" font-size="13" font-weight="500" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">extremo direito</text>
  <text x="500" y="362" fill="#65736c" font-size="14" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Deslize esta janela pela série e repita</text>
</svg>
